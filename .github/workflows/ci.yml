name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: saas_starter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # Stripe's official mock server: StripeGateway and Cashier run against it, no Stripe keys needed.
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111

    env:
      APP_ENV: testing
      STRIPE_MOCK_URL: http://127.0.0.1:12111
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: saas_starter_test
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, pcntl, posix
          coverage: pcov
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: vendor/bin/pest --ci --coverage

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: saas_starter_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025

    # Process env wins over .env, so these configure the app without Redis (sync queue, file cache/sessions).
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: saas_starter_e2e
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      THROTTLE_REGISTRATION_PER_HOUR: 1000
      E2E_BASE_URL: http://127.0.0.1:8000
      MAILPIT_URL: http://127.0.0.1:8025

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, pcntl, posix
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Migrate and seed
        run: php artisan migrate --seed --force

      - name: Start the app
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/up > /dev/null && exit 0
            sleep 1
          done
          cat serve.log
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: acme-app:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e SESSION_DRIVER=file -e CACHE_STORE=file -e QUEUE_CONNECTION=sync \
            acme-app:ci
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/up > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/up
          curl -sI http://127.0.0.1:8080/login | tee headers.txt
          grep -i '^content-security-policy:' headers.txt
          grep -i '^x-request-id:' headers.txt
          docker exec app php -m | grep -E '^(pcntl|posix|redis|pdo_mysql)$'
          docker exec app printenv SENTRY_RELEASE
          docker exec app test -f public/build/manifest.json

      - name: Container logs
        if: failure()
        run: docker logs app
